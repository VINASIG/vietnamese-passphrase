name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.12.14"
          - os: windows-2025-vs2026
            python: "3.14.8"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install --global npm@12.2.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci --ignore-scripts
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: npm run verify
      - run: npm audit --audit-level=low
      - run: python scripts/release_metadata.py
      - run: python -m mypy scripts tests examples
      - run: python -m ruff check scripts tests examples
      - run: python -m ruff format --check scripts tests examples
      - run: python tests/data_test.py
      - run: python tests/vocabulary_test.py
      - run: python tests/publication_test.py
      - name: Recompute research measurements
        run: python scripts/research.py
      - name: Check deterministic research output
        run: git diff --exit-code -- docs/research/sensitivity.json
      - run: python scripts/vocabulary_audit.py
      - run: python scripts/experiment_profiles.py
      - run: python scripts/compare_methodology.py
      - name: Check deterministic vocabulary diagnostics and experiments
        run: git diff --exit-code -- docs/research/adversarial research/experimental
      - name: Build distributions and record actual environment
        shell: bash
        env:
          BUILD_RUNNER_LABEL: ${{ matrix.os }}
        run: |
          python scripts/package_release.py --out output/release
          python scripts/package_release.py --record-environment "output/environment/environment-$BUILD_RUNNER_LABEL.json" --runner-label "$BUILD_RUNNER_LABEL" --assets output/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.os }}
          path: |
            output/release/*.zip
            output/release/SHA256SUMS.txt
            output/release/build-record.json
            output/environment/*.json
          if-no-files-found: error
          retention-days: 30
