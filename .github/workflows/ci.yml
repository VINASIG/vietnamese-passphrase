name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install --global npm@12.2.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: npm ci --ignore-scripts
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: npm run verify
      - run: npm audit --audit-level=low
      - run: python -m mypy scripts tests/data_test.py examples
      - run: python -m ruff check scripts tests/data_test.py examples
      - run: python -m ruff format --check scripts tests/data_test.py examples
      - run: python tests/data_test.py
      - name: Recompute research measurements
        run: python scripts/research.py
      - name: Check deterministic research output
        run: git diff --exit-code -- docs/research/sensitivity.json
      - name: Build integration package
        run: npm pack --pack-destination output
